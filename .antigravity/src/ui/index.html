<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaFloat DE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ultra-Compact Widget Container -->
  <div class="mini-app">

    <!-- Top Mini Toolbar (28px) -->
    <header class="mini-header">
      <div class="header-left">
        <span class="badge-de">DE</span>
        <span id="header-title" class="header-title">LinguaFloat</span>
      </div>

      <div class="header-right">
        <!-- Quick URL Input Button -->
        <button id="btn-open-url-modal" class="btn-tool" title="Load YouTube URL">⚡</button>
        
        <!-- Speed Cycle Button -->
        <button id="btn-cycle-speed" class="btn-tool" title="Playback Speed">1.0x</button>

        <!-- Shadowing / Auto-Loop toggle -->
        <button id="btn-cycle-loop" class="btn-tool" title="Loop Sentence: OFF / 1x / 2x / ∞">🔁</button>

        <!-- Multi-Paragraph A-B Range Loop -->
        <button id="btn-ab-loop" class="btn-tool" title="Multi-Paragraph Loop (Shift+Click or click here)">A-B</button>

        <!-- Noun Gender Highlighting toggle (der=blue, die=red, das=green) -->
        <button id="btn-toggle-gender" class="btn-tool active" title="Noun Genders (der=blue, die=red, das=green)">🎨</button>

        <!-- Global Keyboard Shortcuts toggle (Space, R, Arrows) -->
        <button id="btn-toggle-shortcuts" class="btn-tool active" title="Hotkeys: Space=Play, R=Replay, ↓/↑=Next/Prev">⌨️</button>

        <!-- Auto-scroll status indicator -->
        <button id="btn-toggle-scroll" class="btn-tool active" title="Auto-Scroll ON/OFF">📜</button>

        <!-- Saved Library & Local file load -->
        <button id="btn-open-library-modal" class="btn-tool" title="Saved Lessons & Local Files">📁</button>
        <input type="file" id="local-file-input" accept="audio/*,.json" multiple style="display: none;">

        <!-- Ticker Mode toggle -->
        <button id="btn-toggle-ticker" class="btn-tool" title="Ultra-Compact Ticker Mode (T)">⤢</button>
      </div>
    </header>

    <!-- Ultra-compact Ticker Bar (Displayed in Ticker Mode) -->
    <div id="ticker-bar" class="ticker-bar" style="display: none;">
      <button id="btn-ticker-play" class="btn-play-mini" title="Play / Pause">▶</button>
      <div id="ticker-text" class="ticker-text">
        <span id="ticker-seg-badge" class="ticker-badge">§ 1</span>
        <span id="ticker-words-mount" class="ticker-words-mount"></span>
      </div>
      <button id="btn-ticker-expand" class="btn-tool active" title="Expand Window (T)">⤢</button>
    </div>

    <!-- Mini Player Bar (28px) -->
    <div class="mini-player-bar">
      <button id="btn-play-pause" class="btn-play-mini" title="Play / Pause">▶</button>
      
      <div class="time-and-progress">
        <div class="time-row">
          <span id="time-display" class="time-text">0:00 / 0:00</span>
          <span id="range-badge" class="range-badge" style="display: none;" title="Click to clear loop range">🔁 § A–B ✕</span>
          <span id="status-hint" class="status-hint">Click paragraph to replay</span>
        </div>
        <div id="progress-container" class="progress-container">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- YouTube Hidden / Mini Player Mount -->
    <div id="yt-player-container" class="yt-container" style="display: none;">
      <div id="yt-player"></div>
    </div>

    <!-- HTML5 Audio Element for Local / Streamed Audio -->
    <audio id="audio-engine" preload="auto" style="display: none;"></audio>

    <!-- Main Paragraphs Scroll Area -->
    <main id="transcript-container" class="transcript-scroll">
      <!-- Injected dynamically as .parrafo elements -->
    </main>

    <!-- Processing Progress Overlay -->
    <div id="loader-overlay" class="loader-overlay" style="display: none;">
      <div class="loader-card">
        <div class="loader-spinner"></div>
        <div id="loader-title" class="loader-title">Processing Audio...</div>
        <div id="loader-sub" class="loader-sub">Downloading audio stream...</div>
        <div class="loader-track">
          <div id="loader-bar" class="loader-bar"></div>
        </div>
        <span id="loader-pct" class="loader-pct">0%</span>
      </div>
    </div>

    <!-- Quick URL Modal / Dropdown -->
    <div id="url-modal" class="url-modal" style="display: none;">
      <div class="url-modal-content">
        <input 
          type="text" 
          id="yt-url-input" 
          class="url-input" 
          placeholder="Paste YouTube Link..."
        />
        <div class="modal-buttons">
          <button id="btn-submit-url" class="btn-modal-primary">Load</button>
          <button id="btn-close-modal" class="btn-modal-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Library Modal: Saved in downloads/ & Local files -->
    <div id="library-modal" class="url-modal" style="display: none;">
      <div class="url-modal-content library-modal-content">
        <div class="library-header">
          <span class="library-title">📁 Saved Lessons</span>
          <button id="btn-close-library" class="btn-modal-close" title="Close">✕</button>
        </div>
        <div id="library-list" class="library-list">
          <div class="library-loading">Loading saved lessons...</div>
        </div>
        <div class="library-footer">
          <button id="btn-browse-local" class="btn-modal-secondary" style="width: 100%;">📂 Browse Local (Audio + JSON)</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
